resources:
  apps:
    northbeam_review_app:
      name: northbeam-enrichment-console
      description: Northbeam analysts review AI-enriched snack-bar products (Lakebase) and ask Genie.
      source_code_path: ../app
      resources:
        - name: lakebase
          database:
            instance_name: ${var.lakebase_instance}
            database_name: northbeam
            permission: CAN_CONNECT_AND_CREATE
        - name: genie-space
          genie_space:
            name: Northbeam Snack Bar Product Intelligence
            space_id: ${var.genie_space_id}
            permission: CAN_RUN
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
